<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="_ds/photo-widget-design-system-69a50d31-8718-46d0-b478-b19799a4c344/tokens/fonts.css">
  <link rel="stylesheet" href="_ds/photo-widget-design-system-69a50d31-8718-46d0-b478-b19799a4c344/tokens/colors.css">
  <link rel="stylesheet" href="_ds/photo-widget-design-system-69a50d31-8718-46d0-b478-b19799a4c344/tokens/typography.css">
  <link rel="stylesheet" href="_ds/photo-widget-design-system-69a50d31-8718-46d0-b478-b19799a4c344/tokens/spacing.css">
  <link rel="stylesheet" href="_ds/photo-widget-design-system-69a50d31-8718-46d0-b478-b19799a4c344/tokens/effects.css">
  <link rel="stylesheet" href="_ds/photo-widget-design-system-69a50d31-8718-46d0-b478-b19799a4c344/styles.css">
  <script src="_ds/photo-widget-design-system-69a50d31-8718-46d0-b478-b19799a4c344/_ds_bundle.js"></script>
  <style>
    body{margin:0;background:var(--pw-cream-200);font-family:var(--font-body);}
    a{color:var(--accent-primary)}a:hover{color:var(--accent-primary-hover)}
  </style>
</helmet>
<div style="display:flex;align-items:flex-start;justify-content:center;padding:64px 40px;">
  <x-import component-from-global-scope="AndroidDevice" from="./android-frame.jsx" dark="{{ isDark }}" hint-size="412px,892px">
    <div style="{{ splashStyle }}">
      <div style="{{ polaroidCard }}"><div style="{{ polaroidPhoto }}"></div></div>
      <div style="{{ titleBlockStyle }}">
        <div style="{{ titleStyle }}">Photo Widget</div>
        <div style="{{ subtitleStyle }}">A photo, always close.</div>
        <div style="{{ loaderWrapStyle }}">
          <x-import component-from-global-scope="PhotoWidgetDesignSystem_69a50d.ProgressIndicator" indeterminate="{{ true }}" hint-size="64px,6px"></x-import>
        </div>
      </div>
      <div style="{{ byLineStyle }}">by Siver Company</div>
    </div>
  </x-import>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;theme&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;default&quot;:&quot;light&quot;,&quot;tsType&quot;:&quot;'light'|'dark'&quot;,&quot;options&quot;:[&quot;light&quot;,&quot;dark&quot;]}}">
class Component extends DCLogic {
  renderVals() {
    const s = (obj) => Object.entries(obj).map(([k, v]) => {
      const prop = k.replace(/[A-Z]/g, m => '-' + m.toLowerCase());
      return `${prop}:${typeof v === 'number' ? v + 'px' : v}`;
    }).join(';');

    const theme = this.props.theme ?? 'light';
    const isDark = theme === 'dark';

    const base = {
      width: '100%', height: '100%', display: 'flex', flexDirection: 'column',
      alignItems: 'center', justifyContent: 'center', boxSizing: 'border-box', gap: 44,
      position: 'relative',
    };
    const byLineBase = { position: 'absolute', bottom: 40, left: 0, right: 0, textAlign: 'center', font: `400 var(--fs-caption)/1 var(--font-body)`, letterSpacing: 'var(--tracking-wide)' };

    return {
      isDark,
      splashStyle: s({ ...base, background: isDark
        ? 'radial-gradient(circle at 50% 38%, #2B2823 0%, #211F1B 60%, #18160F 100%)'
        : 'radial-gradient(circle at 50% 38%, #F9F4EC 0%, #EFE6D6 60%, #E6DAC3 100%)' }),

      polaroidCard: s({ width: 200, height: 244, background: '#FBF8F3', borderRadius: 8, boxShadow: '0 20px 48px rgba(33,31,27,0.18)', transform: 'rotate(-4deg)', padding: '14px 14px 40px', boxSizing: 'border-box' }),
      polaroidPhoto: s({ width: '100%', height: '100%', borderRadius: 4, background: isDark
        ? 'linear-gradient(135deg,#8C4C29,#5C6850)'
        : 'linear-gradient(135deg,#D99A6C,#ACBC9C)' }),

      titleBlockStyle: s({ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 10 }),
      titleStyle: s({ font: `italic 400 32px/1.18 var(--font-display)`, color: isDark ? 'var(--pw-cream-50)' : 'var(--pw-ink-900)', letterSpacing: '-0.01em' }),
      subtitleStyle: s({ font: `400 19px/1.4 var(--font-body)`, color: isDark ? 'var(--pw-cream-300)' : 'var(--pw-ink-500)' }),

      byLineStyle: s({ ...byLineBase, color: 'var(--pw-ink-300)' }),
      loaderWrapStyle: s({ width: 64, marginTop: 6 }),
    };
  }
}

</script>
</body>
</html>
