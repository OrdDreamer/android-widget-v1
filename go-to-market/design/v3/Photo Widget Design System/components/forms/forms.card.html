<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--surface-app);padding:24px;font-family:var(--font-body)"></div>
<script type="text/babel">
const { Input, Select, Checkbox, Radio, Switch } = window.PhotoWidgetDesignSystem_69a50d;
function Demo(){
  const [caption,setCaption]=React.useState('');
  const [shape,setShape]=React.useState('square');
  const [cb,setCb]=React.useState(true);
  const [sw,setSw]=React.useState(false);
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16,maxWidth:420}}>
      <Input label="Caption" placeholder="Add a caption…" icon="edit" value={caption} onChange={setCaption} />
      <Select label="Update every" value="1d" onChange={()=>{}} options={[{label:'1 hour',value:'1h'},{label:'1 day',value:'1d'}]} />
      <div style={{display:'flex',gap:20}}>
        <Radio name="shape" label="Square" checked={shape==='square'} onChange={()=>setShape('square')} />
        <Radio name="shape" label="Round" checked={shape==='round'} onChange={()=>setShape('round')} />
      </div>
      <Checkbox label="Show caption" checked={cb} onChange={setCb} />
      <Switch label="Auto-refresh" checked={sw} onChange={setSw} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
