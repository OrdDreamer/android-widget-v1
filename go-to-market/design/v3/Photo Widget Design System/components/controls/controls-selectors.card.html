<link rel="stylesheet" href="../../styles.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@24,400,0,0" />
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<div id="root" style="background:var(--surface-app);padding:24px;font-family:var(--font-body)"></div>
<script type="text/babel">
const { Chip, SegmentedControl, FrameStyleSelector, AlignmentPad } = window.PhotoWidgetDesignSystem_69a50d;
function Demo(){
  const [interval,setInterval_]=React.useState('1h');
  const [theme,setTheme]=React.useState('light');
  const [wide,setWide]=React.useState('sq');
  const [shape,setShape]=React.useState('rounded');
  const [anchor,setAnchor]=React.useState('center');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:20}}>
      <div style={{display:'flex',gap:8}}>
        <Chip icon="schedule" selected={interval==='1h'} onClick={()=>setInterval_('1h')}>1 hour</Chip>
        <Chip selected={interval==='1d'} onClick={()=>setInterval_('1d')}>1 day</Chip>
        <Chip selected={interval==='custom'} onClick={()=>setInterval_('custom')}>Custom</Chip>
      </div>
      <div style={{display:'flex',gap:24,alignItems:'center'}}>
        <SegmentedControl options={[{label:'Light',value:'light'},{label:'Dark',value:'dark'}]} value={theme} onChange={setTheme} />
        <div style={{width:260}}><SegmentedControl fullWidth options={[{label:'Square',value:'sq'},{label:'Round',value:'rd'},{label:'Polaroid',value:'pl'}]} value={wide} onChange={setWide} /></div>
      </div>
      <FrameStyleSelector value={shape} onChange={setShape} />
      <AlignmentPad value={anchor} onChange={setAnchor} />
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
