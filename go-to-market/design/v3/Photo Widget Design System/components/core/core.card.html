<div id="root" style="background:var(--surface-app);padding:24px;font-family:var(--font-body)"></div>
<script type="text/babel">
const { Button, IconButton, Card, Badge, Tag } = window.PhotoWidgetDesignSystem_69a50d;
function Demo(){
  const [sel,setSel]=React.useState('square');
  return (
    <div style={{display:'flex',flexDirection:'column',gap:16}}>
      <div style={{display:'flex',gap:10,flexWrap:'wrap',alignItems:'center'}}>
        <Button variant="primary" icon="add_photo_alternate">Add photo</Button>
        <Button variant="secondary">Secondary</Button>
        <Button variant="outline">Outline</Button>
        <Button variant="ghost">Ghost</Button>
        <Button variant="primary" disabled>Disabled</Button>
        <IconButton icon="settings" variant="filled" label="Settings" />
        <IconButton icon="favorite" variant="accent" label="Favorite" />
      </div>
      <div style={{display:'flex',gap:10,alignItems:'center'}}>
        <Badge tone="accent">New</Badge>
        <Badge tone="success">Synced</Badge>
        <Badge tone="neutral">Beta</Badge>
        <Tag selected={sel==='square'} onClick={()=>setSel('square')}>Square</Tag>
        <Tag selected={sel==='round'} onClick={()=>setSel('round')}>Round</Tag>
      </div>
      <Card padding="sm" style={{maxWidth:320}}>
        <div style={{fontFamily:'var(--font-display)',fontSize:18,color:'var(--text-primary)'}}>Card surface</div>
        <div style={{fontSize:'var(--fs-body-sm)',color:'var(--text-muted)',marginTop:4}}>Default card with hairline border.</div>
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<Demo/>);
</script>
