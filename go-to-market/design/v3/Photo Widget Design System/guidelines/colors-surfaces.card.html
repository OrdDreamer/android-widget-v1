<!-- @dsCard group="Colors" viewport="700x110" name="Semantic Surfaces" subtitle="App background, card, raised, sunken" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:8px;padding:12px;background:#fff;height:86px;font-family:var(--font-body);font-size:12px;color:var(--text-secondary)">
<div style="flex:1;background:var(--surface-app);display:flex;align-items:flex-end;padding:8px;border-radius:8px">app</div>
<div style="flex:1;background:var(--surface-card);border:1px solid var(--border-subtle);display:flex;align-items:flex-end;padding:8px;border-radius:8px">card</div>
<div style="flex:1;background:var(--surface-raised);box-shadow:var(--shadow-md);display:flex;align-items:flex-end;padding:8px;border-radius:8px">raised</div>
<div style="flex:1;background:var(--surface-sunken);display:flex;align-items:flex-end;padding:8px;border-radius:8px">sunken</div>
<div style="flex:1;background:var(--surface-inverse);color:var(--text-inverse);display:flex;align-items:flex-end;padding:8px;border-radius:8px">inverse</div>
</div>
