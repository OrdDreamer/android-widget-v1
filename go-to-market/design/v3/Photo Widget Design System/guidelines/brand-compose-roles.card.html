<!-- @dsCard group="Brand" viewport="700x260" name="Compose Color Roles" subtitle="Custom ColorScheme mapping — not Material 3 defaults" -->
<link rel="stylesheet" href="../styles.css">
<div style="display:grid;grid-template-columns:repeat(4,1fr);gap:1px;background:var(--border-subtle);height:230px;font-family:var(--font-body);font-size:11px">
<div style="background:var(--accent-primary);color:#fff;padding:8px;display:flex;align-items:flex-end">primary</div>
<div style="background:var(--pw-terracotta-900);color:#fff;padding:8px;display:flex;align-items:flex-end">onPrimaryContainer</div>
<div style="background:var(--accent-secondary);color:#fff;padding:8px;display:flex;align-items:flex-end">secondary</div>
<div style="background:var(--pw-sage-100);color:var(--text-primary);padding:8px;display:flex;align-items:flex-end">secondaryContainer</div>
<div style="background:var(--surface-app);color:var(--text-primary);padding:8px;display:flex;align-items:flex-end">background</div>
<div style="background:var(--surface-card);color:var(--text-primary);padding:8px;display:flex;align-items:flex-end">surface</div>
<div style="background:var(--pw-cream-200);color:var(--text-primary);padding:8px;display:flex;align-items:flex-end">surfaceVariant</div>
<div style="background:var(--border-default);color:var(--text-primary);padding:8px;display:flex;align-items:flex-end">outline</div>
<div style="background:var(--text-primary);color:var(--surface-card);padding:8px;display:flex;align-items:flex-end">onSurface / inverseSurface</div>
<div style="background:var(--status-danger);color:#fff;padding:8px;display:flex;align-items:flex-end">error</div>
<div style="background:var(--accent-primary-subtle);color:var(--pw-terracotta-900);padding:8px;display:flex;align-items:flex-end">primaryContainer</div>
<div style="background:var(--text-muted);color:#fff;padding:8px;display:flex;align-items:flex-end">onSurfaceVariant</div>
</div>
