<link rel="stylesheet" href="../styles.css">
<div style="display:flex;gap:16px;padding:16px;background:var(--surface-app);height:58px;align-items:center;font-family:var(--font-body);font-size:13px;color:var(--text-secondary)">
<div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:50%;background:var(--status-success)"></span>Success</div>
<div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:50%;background:var(--status-danger)"></span>Danger</div>
<div style="display:flex;align-items:center;gap:8px"><span style="width:20px;height:20px;border-radius:50%;background:var(--status-warning)"></span>Warning</div>
</div>
